name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          # Standalone: no .NET install needed. Small: needs the .NET 10 Desktop Runtime.
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/small
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/standalone/UsageTray.exe dist/UsageTray-win-x64.exe
          Copy-Item out/small/UsageTray.exe dist/UsageTray-win-x64-small.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "UsageTray ${{ github.ref_name }}" --generate-notes
